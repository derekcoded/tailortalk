services:
  - type: web
    name: tailortalk
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "streamlit run src/app.py --server.port $PORT --server.address 0.0.0.0"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: PYTHON_VERSION
        value: 3.11.9
